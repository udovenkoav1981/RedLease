name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install FlatBuffers compiler
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g%2B%2B-13.zip \
            --output "$RUNNER_TEMP/flatc.zip"
          unzip -q "$RUNNER_TEMP/flatc.zip" -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"

      - name: Verify generated FlatBuffers files
        run: |
          make generate-flatbuffers
          git diff --exit-code -- fbs/redlease/v1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build static redlease-server
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o dist/redlease-server-linux-amd64 \
            ./cmd/redlease-server

      - name: Verify static binary
        run: |
          if readelf --program-headers dist/redlease-server-linux-amd64 | grep -q INTERP; then
            echo 'redlease-server is dynamically linked' >&2
            exit 1
          fi

      - name: Install package repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils createrepo-c dpkg-dev rpm

      - name: Build RPM
        run: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          install -Dpm 0755 \
            dist/redlease-server-linux-amd64 \
            rpmbuild/SOURCES/redlease-server
          install -Dpm 0644 LICENSE rpmbuild/SOURCES/LICENSE
          install -Dpm 0644 \
            packaging/rpm/redlease-server.service \
            rpmbuild/SOURCES/redlease-server.service
          install -Dpm 0644 \
            packaging/rpm/redlease-server.sysconfig \
            rpmbuild/SOURCES/redlease-server.sysconfig
          rpmbuild -bb packaging/rpm/redlease-server.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "redlease_version $RELEASE_VERSION" \
            --target x86_64
          cp \
            "rpmbuild/RPMS/x86_64/redlease-server-$RELEASE_VERSION-1.x86_64.rpm" \
            dist/
          rpm -qpl "dist/redlease-server-$RELEASE_VERSION-1.x86_64.rpm"

      - name: Build DEB
        run: |
          package_root="debbuild/redlease-server_${RELEASE_VERSION}-1_amd64"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/etc/default" \
            "$package_root/usr/bin" \
            "$package_root/usr/lib/systemd/system" \
            "$package_root/usr/share/doc/redlease-server"
          sed "s/@VERSION@/$RELEASE_VERSION-1/" \
            packaging/deb/control > "$package_root/DEBIAN/control"
          install -m 0644 packaging/deb/conffiles "$package_root/DEBIAN/conffiles"
          install -m 0755 packaging/deb/postinst "$package_root/DEBIAN/postinst"
          install -m 0755 packaging/deb/prerm "$package_root/DEBIAN/prerm"
          install -m 0755 packaging/deb/postrm "$package_root/DEBIAN/postrm"
          install -m 0755 \
            dist/redlease-server-linux-amd64 \
            "$package_root/usr/bin/redlease-server"
          install -m 0644 \
            packaging/deb/redlease-server.service \
            "$package_root/usr/lib/systemd/system/redlease-server.service"
          install -m 0644 \
            packaging/deb/redlease-server.default \
            "$package_root/etc/default/redlease-server"
          install -m 0644 LICENSE "$package_root/usr/share/doc/redlease-server/copyright"
          dpkg-deb --root-owner-group --build \
            "$package_root" \
            "dist/redlease-server_${RELEASE_VERSION}-1_amd64.deb"
          dpkg-deb --info "dist/redlease-server_${RELEASE_VERSION}-1_amd64.deb"
          dpkg-deb --contents "dist/redlease-server_${RELEASE_VERSION}-1_amd64.deb"

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum redlease-server-linux-amd64 > redlease-server-linux-amd64.sha256
          sha256sum \
            "redlease-server-$RELEASE_VERSION-1.x86_64.rpm" \
            > "redlease-server-$RELEASE_VERSION-1.x86_64.rpm.sha256"
          sha256sum \
            "redlease-server_${RELEASE_VERSION}-1_amd64.deb" \
            > "redlease-server_${RELEASE_VERSION}-1_amd64.deb.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Assemble package repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p \
            pages/deb/dists/stable/main/binary-amd64 \
            pages/deb/pool/main/r/redlease-server \
            pages/rpm/x86_64
          cp packaging/index.html pages/index.html
          cp packaging/deb/index.html pages/deb/index.html
          cp packaging/deb/redlease.list pages/redlease.list
          cp packaging/rpm/redlease.repo pages/redlease.repo
          while IFS=$'\t' read -r asset_url asset_name; do
            if [[ -z "${asset_url:-}" ]]; then
              continue
            fi
            case "$asset_name" in
              redlease-server-*.x86_64.rpm)
                destination=pages/rpm/x86_64
                ;;
              redlease-server_*_amd64.deb)
                destination=pages/deb/pool/main/r/redlease-server
                ;;
              *)
                continue
                ;;
            esac
            gh api \
              --header 'Accept: application/octet-stream' \
              "$asset_url" \
              > "$destination/$asset_name"
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .assets[] | select((.name | startswith("redlease-server-") and endswith(".x86_64.rpm")) or (.name | startswith("redlease-server_") and endswith("_amd64.deb"))) | [.url, .name] | @tsv'
          )
          cp dist/*.x86_64.rpm pages/rpm/x86_64/
          cp dist/*_amd64.deb pages/deb/pool/main/r/redlease-server/
          createrepo_c --quiet pages/rpm/x86_64
          {
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
              '  <title>RedLease x86_64 RPM packages</title>' \
              '</head>' \
              '<body>' \
              '  <h1>RedLease x86_64 RPM packages</h1>' \
              '  <ul>'
            for package_path in pages/rpm/x86_64/*.rpm; do
              package_name="${package_path##*/}"
              printf '    <li><a href="%s">%s</a></li>\n' \
                "$package_name" "$package_name"
            done
            printf '%s\n' \
              '  </ul>' \
              '  <p><a href="repodata/repomd.xml">Repository metadata</a></p>' \
              '  <p><a href="../../">Repository setup</a></p>' \
              '</body>' \
              '</html>'
          } > pages/rpm/x86_64/index.html
          (
            cd pages/deb
            dpkg-scanpackages --arch amd64 --multiversion pool/main \
              > dists/stable/main/binary-amd64/Packages
            gzip --best --keep dists/stable/main/binary-amd64/Packages
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=RedLease \
              -o APT::FTPArchive::Release::Label=RedLease \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures=amd64 \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Description='RedLease APT repository' \
              release dists/stable > dists/stable/Release
          )
          {
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
              '  <title>RedLease amd64 DEB packages</title>' \
              '</head>' \
              '<body>' \
              '  <h1>RedLease amd64 DEB packages</h1>' \
              '  <ul>'
            for package_path in pages/deb/pool/main/r/redlease-server/*.deb; do
              package_name="${package_path##*/}"
              printf '    <li><a href="%s">%s</a></li>\n' \
                "$package_name" "$package_name"
            done
            printf '%s\n' \
              '  </ul>' \
              '  <p><a href="../../../../../">Repository setup</a></p>' \
              '</body>' \
              '</html>'
          } > pages/deb/pool/main/r/redlease-server/index.html

      - name: Upload package repositories for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-package-repositories:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy package repositories to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
