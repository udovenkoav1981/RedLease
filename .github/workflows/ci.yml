name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install FlatBuffers compiler
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g%2B%2B-13.zip \
            --output "$RUNNER_TEMP/flatc.zip"
          unzip -q "$RUNNER_TEMP/flatc.zip" -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"

      - name: Verify generated FlatBuffers files
        run: |
          make generate-flatbuffers
          git diff --exit-code -- fbs/redlease/v1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve RPM version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RPM_VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "RPM_VERSION=$RPM_VERSION" >> "$GITHUB_ENV"

      - name: Build static redlease-server
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o dist/redlease-server-linux-amd64 \
            ./cmd/redlease-server

      - name: Verify static binary
        run: |
          if readelf --program-headers dist/redlease-server-linux-amd64 | grep -q INTERP; then
            echo 'redlease-server is dynamically linked' >&2
            exit 1
          fi

      - name: Install RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes createrepo-c rpm

      - name: Build RPM
        run: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          install -Dpm 0755 \
            dist/redlease-server-linux-amd64 \
            rpmbuild/SOURCES/redlease-server
          install -Dpm 0644 LICENSE rpmbuild/SOURCES/LICENSE
          install -Dpm 0644 \
            packaging/rpm/redlease-server.service \
            rpmbuild/SOURCES/redlease-server.service
          install -Dpm 0644 \
            packaging/rpm/redlease-server.sysconfig \
            rpmbuild/SOURCES/redlease-server.sysconfig
          rpmbuild -bb packaging/rpm/redlease-server.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "redlease_version $RPM_VERSION" \
            --target x86_64
          cp \
            "rpmbuild/RPMS/x86_64/redlease-server-$RPM_VERSION-1.x86_64.rpm" \
            dist/
          rpm -qpl "dist/redlease-server-$RPM_VERSION-1.x86_64.rpm"

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum redlease-server-linux-amd64 > redlease-server-linux-amd64.sha256
          sha256sum \
            "redlease-server-$RPM_VERSION-1.x86_64.rpm" \
            > "redlease-server-$RPM_VERSION-1.x86_64.rpm.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Assemble RPM repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pages/rpm/x86_64
          cp packaging/rpm/index.html packaging/rpm/redlease.repo pages/
          while IFS=$'\t' read -r asset_url asset_name; do
            if [[ -z "${asset_url:-}" ]]; then
              continue
            fi
            gh api \
              --header 'Accept: application/octet-stream' \
              "$asset_url" \
              > "pages/rpm/x86_64/$asset_name"
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .assets[] | select(.name | startswith("redlease-server-") and endswith(".x86_64.rpm")) | [.url, .name] | @tsv'
          )
          cp dist/*.x86_64.rpm pages/rpm/x86_64/
          createrepo_c --quiet pages/rpm/x86_64

      - name: Upload RPM repository for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-rpm-repository:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy RPM repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
