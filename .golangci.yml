version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose # проверка что закрыли body запроса
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    #- depguard # Go linter that checks if package imports are in a list of acceptable packages.
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd 
    - fatcontext
    # - forbidigo  
    - forcetypeassert
    - funlen
    - ginkgolinter 
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecksumtype 
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint 
    - godot
    # TODO: Раскомментировать после получения доступа в gonum.org
    # - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck 
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    #- tagliatelle # we dont have a uniform rule for json and xml tags
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    # - varnamelen # does not allow for var name like ok, wg, ... And we have t
    - wastedassign
    - whitespace
    - zerologlint # для логгера
  settings:
    goconst:
      # The exclusions below already say goconst does not apply to _test.go, but
      # occurrences there were still counted towards the "3 or more" threshold,
      # so a literal written once in production and twice in its table-driven
      # test was reported against the production line. Counting and reporting
      # now agree.
      ignore-tests: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - unnamedResult
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      severity: warning
      rules:
        - name: indent-error-flow
          severity: warning
        - name: add-constant
          arguments:
            - allowFloats: 0.0,0.,1.0,1.,2.0,2.
              allowInts: 0,1,2,3,4,5
              allowStrs: '"","error"'
              maxLitCount: "11"
          severity: warning
    cyclop:
      max-complexity: 46
      package-average: 15
    dogsled:
      max-blank-identifiers: 3
    modernize:
     disable:
        - omitzero # it conflicts removing omitempty and adding omitzero
    ginkgolinter:
       force-expect-to: true
       validate-async-intervals: true
    godoclint:
      disable:
        - start-with-name
        - pkg-doc
        - single-pkg-doc
    gocognit:
      min-complexity: 90
    gomoddirectives:
       replace-allow-list:
          - github.com/cespare/xxhash/v2
          - github.com/gocql/gocql
          - github.com/gocql/gocql/lz4
          - go.etcd.io/etcd/api/v3
          - go.etcd.io/etcd/client/v3
          - go.etcd.io/etcd/server/v3
    iface:
      enable:
        - identical # Identifies interfaces in the same package that have identical method sets.
        - opaque # Identifies functions that return interfaces, but the actual returned value is always a single concrete implementation.
    nestif:
      min-complexity: 12
    funlen:
      lines: 180
      statements: 100
  exclusions:
    generated: lax
    rules:
      # container/heap guarantees these concrete element types.
      - path: server/state.go
        linters:
          - forcetypeassert
      # Retry jitter is not used for cryptography.
      - path: internal/backoff/backoff.go
        text: "G404:"
        linters:
          - gosec
      # CLOCK_BOOTTIME is non-negative, counters fail-stop before underflow,
      # and a hash modulo slice length always fits int.
      - path: internal/boottime/boottime_linux.go|server/metrics.go|server/state.go
        text: "G115:"
        linters:
          - gosec
      # These immutable process-wide values are intentional.
      - path: server/prometheus/collector.go
        text: "serverStates is a global variable"
        linters:
          - gochecknoglobals
      - path: server/state.go
        text: "hashSeed is a global variable"
        linters:
          - gochecknoglobals
      # This lock/unlock pair is a synchronization barrier waiting for an
      # already-started Renew; extending the critical section is unnecessary.
      - path: client1of1/lease.go
        text: "badLock|SA2001"
        linters:
          - gocritic
          - staticcheck

      - linters:
          - funlen
          - goconst
          - gochecknoglobals
          - lll
          - mnd
          - revive
          - testpackage
        path: _test\.go
    paths:
      - vendor
issues:
  max-issues-per-linter: 50
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - vendor
      - internal/database/mock/...
      - third_party$
      - builtin$
      - examples$
